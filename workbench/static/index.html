<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capital as power workbench</title>
<link rel="stylesheet" href="/static/fonts/switzer.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="runs" aria-label="Runs">
    <div class="runs-head">
      <div class="app-name">Capital as power workbench</div>
      <div class="runs-title"><h1 style="font-size:var(--step-1)">Runs</h1><button class="btn primary sm" id="new-btn" aria-haspopup="menu" aria-expanded="false">+ New ▾</button></div>
      <div class="new-menu" id="new-menu" role="menu" hidden>
        <button role="menuitem" id="m-run">New run<span>One run with the settings you choose.</span></button>
        <button role="menuitem" id="m-exp">New experiment<span>Several runs that vary one or more settings.</span></button>
      </div>
      <p class="small muted">Tick runs to show them. ★ marks the baseline of each experiment: the run the others in it are compared with.</p>
    </div>
    <div class="runs-list" id="runs-list"></div>
  </aside>

  <main class="main" id="main">
    <div class="tabs" role="tablist" id="tabs"><div class="spacer"></div><div class="legend" id="legend"></div></div>
    <div class="panel" id="panel-charts" role="tabpanel"></div>
    <div class="panel" id="panel-map" role="tabpanel" hidden>
      <div class="mp-top">
        <div class="ctl"><label for="mp-run">Run</label><span class="ln"></span><select class="select" id="mp-run"></select></div>
        <div class="ctl"><label for="mp-vs">Compare with</label><span class="ln b" id="mp-vs-ln" hidden></span><select class="select" id="mp-vs"></select></div>
        <div class="ctl"><label for="mp-measure">Show</label><select class="select" id="mp-measure">
          <option value="run">Gain over the run</option><option value="year">Gain in one year</option><option value="diff">Difference between the 2 runs</option></select></div>
        <div class="ctl" id="mp-year-ctl" hidden><label for="mp-year">Year</label><input id="mp-year" type="range" min="1891" max="2009" value="1920"><b id="mp-year-out">1920</b></div>
        <div class="spacer"></div>
      </div>
      <div class="mp-body">
        <div class="mp-canvas" id="mp-canvas">
          <svg id="mp-svg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of modules and the figures they pass to each other">
            <defs>
              <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--edge)"/></marker>
              <marker id="arr-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--edge-core)"/></marker>
              <marker id="arr-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker>
            </defs>
            <g id="mp-edges"></g><g id="mp-nodes"></g>
          </svg>
          <p class="mp-hint">Arrows show the figures one module passes to another. Point at an arrow to see them.</p>
          <div class="mp-legend" id="mp-legend"></div>
          <section class="drawer" id="mp-drawer" hidden aria-live="polite"></section>
        </div>
        <aside class="insp" id="mp-insp" aria-label="Selected module"></aside>
      </div>
      <nav class="mp-strip" id="mp-strip" aria-label="Main figures"></nav>
    </div>
    <div class="panel" id="panel-compare" role="tabpanel" hidden></div>
    <div class="panel" id="panel-score" role="tabpanel" hidden></div>
    <div class="panel" id="panel-gain" role="tabpanel" hidden></div>
    <div class="panel" id="panel-experiment" role="tabpanel" hidden></div>
  </main>
</div>
<div class="setup" id="setup" role="dialog" aria-modal="true" hidden></div>
<div class="pop" id="pop" role="menu" hidden></div>
<div class="modal-back" id="confirm" hidden></div>
<div class="modal-back" id="picker" hidden></div>
<div class="tip" id="tip" hidden></div>
<div class="hovtip" id="hovtip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
